"""
Unit tests for Pydantic input schemas.

All validation logic lives in schemas.py. These tests confirm that:
  - Valid inputs are accepted
  - Invalid inputs raise ValidationError with a useful message
  - Boundary values are handled correctly
"""

from __future__ import annotations

import pytest
from pydantic import ValidationError


class TestSubscriptionIn:
    """GUID validation on subscription_id and tenant_id."""

    def _make(self, **kwargs):
        from app.api.schemas import SubscriptionIn
        defaults = {
            "subscription_id": "9a2f8c1d-0001-0001-0001-000000000001",
            "tenant_id":       "tenant00-0002-0002-0002-000000000002",
            "name": "Test Sub",
        }
        return SubscriptionIn(**{**defaults, **kwargs})

    def test_valid_subscription(self):
        sub = self._make()
        assert sub.name == "Test Sub"

    def test_invalid_subscription_id_raises(self):
        with pytest.raises(ValidationError) as exc_info:
            self._make(subscription_id="not-a-guid")
        assert "GUID" in str(exc_info.value)

    def test_invalid_tenant_id_raises(self):
        with pytest.raises(ValidationError):
            self._make(tenant_id="bad-value")

    def test_uppercase_guid_accepted(self):
        sub = self._make(subscription_id="9A2F8C1D-0001-0001-0001-000000000001")
        assert sub.subscription_id == "9A2F8C1D-0001-0001-0001-000000000001"

    def test_default_enabled_is_true(self):
        assert self._make().enabled is True


class TestActionRequest:
    """action_type must be one of the allowed values."""

    def _make(self, **kwargs):
        from app.api.schemas import ActionRequest
        defaults = {
            "resource_db_id": "9a2f8c1d-0001-0001-0001-000000000001",
            "action_type":    "deallocate",
        }
        return ActionRequest(**{**defaults, **kwargs})

    @pytest.mark.parametrize("action", ["deallocate", "delete", "tag", "snapshot", "tier_down", "resize"])
    def test_valid_action_types(self, action):
        req = self._make(action_type=action)
        assert req.action_type == action

    def test_invalid_action_type_raises(self):
        with pytest.raises(ValidationError) as exc_info:
            self._make(action_type="explode")
        assert "action_type" in str(exc_info.value)

    def test_invalid_resource_uuid_raises(self):
        with pytest.raises(ValidationError):
            self._make(resource_db_id="not-a-uuid")

    def test_empty_action_type_raises(self):
        with pytest.raises(ValidationError):
            self._make(action_type="")


class TestTriggerRunRequest:
    """policy_ids and subscription_ids must be valid UUIDs."""

    def _make(self, **kwargs):
        from app.api.schemas import TriggerRunRequest
        defaults = {"policy_ids": ["9a2f8c1d-0001-0001-0001-000000000001"]}
        return TriggerRunRequest(**{**defaults, **kwargs})

    def test_valid_request(self):
        req = self._make()
        assert len(req.policy_ids) == 1

    def test_invalid_policy_uuid_raises(self):
        with pytest.raises(ValidationError):
            self._make(policy_ids=["not-a-uuid"])

    def test_invalid_subscription_uuid_raises(self):
        with pytest.raises(ValidationError):
            self._make(
                subscription_ids=["9a2f8c1d-0001-0001-0001-000000000001", "bad"]
            )

    def test_none_subscription_ids_accepted(self):
        req = self._make(subscription_ids=None)
        assert req.subscription_ids is None

    def test_parallel_defaults_to_10(self):
        assert self._make().parallel == 10

    def test_multiple_valid_policy_ids(self):
        ids = [
            "9a2f8c1d-0001-0001-0001-000000000001",
            "9a2f8c1d-0001-0001-0001-000000000002",
        ]
        req = self._make(policy_ids=ids)
        assert len(req.policy_ids) == 2
