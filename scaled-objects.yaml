import { useQuery, useQueryClient } from 'react-query'
import { fetchResources, toggleExempt, triggerAction } from '../../lib/api'
import { useState } from 'react'
import { format } from 'date-fns'
import toast from 'react-hot-toast'
import {
  Filter, ShieldOff, Shield, Zap, Search,
  ChevronDown, ChevronUp, ExternalLink
} from 'lucide-react'

const SEV = { critical: 'badge-critical', high: 'badge-high', medium: 'badge-medium', low: 'badge-low' }
const LADDER_STEPS = ['notify', 'tagged', 'deallocated', 'deleted']
const LADDER_COLORS = {
  notify: 'var(--text-2)', tagged: 'var(--amber)',
  deallocated: 'var(--purple)', deleted: 'var(--red)',
  exempt: 'var(--green)', resized: 'var(--accent)', tiered_down: 'var(--accent)',
}

const ACTIONS = [
  { key: 'tag',        label: 'Tag for deletion', color: 'var(--amber)' },
  { key: 'deallocate', label: 'Deallocate',        color: 'var(--purple)' },
  { key: 'snapshot',   label: 'Snapshot first',    color: 'var(--accent)' },
  { key: 'resize',     label: 'Resize (B2s)',      color: 'var(--accent)' },
  { key: 'tier_down',  label: 'Tier to Cool',      color: 'var(--green)' },
  { key: 'delete',     label: 'Delete now',        color: 'var(--red)' },
]

function LadderBar({ status }) {
  const idx = LADDER_STEPS.indexOf(status)
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 3 }}>
      {LADDER_STEPS.map((s, i) => (
        <div key={s} style={{
          width: 18, height: 4, borderRadius: 2,
          background: i <= idx ? LADDER_COLORS[s] : 'var(--border)',
          opacity: i <= idx ? 1 : 0.5,
          transition: 'background 0.2s',
        }} />
      ))}
      <span style={{ fontSize: 11, color: LADDER_COLORS[status] || 'var(--text-3)', fontFamily: 'var(--font-mono)', marginLeft: 6 }}>
        {status}
      </span>
    </div>
  )
}

function ActionMenu({ resource, onDone }) {
  const [open, setOpen] = useState(false)
  const [loading, setLoading] = useState(null)

  const fire = async (actionKey) => {
    if (actionKey === 'delete' && !confirm(`Delete ${resource.resource_name}? This cannot be undone.`)) return
    setLoading(actionKey)
    try {
      await triggerAction({ resource_db_id: resource.id, action_type: actionKey })
      toast.success(`${actionKey} queued for ${resource.resource_name}`)
      onDone()
    } catch { toast.error('Action failed') }
    finally { setLoading(null); setOpen(false) }
  }

  return (
    <div style={{ position: 'relative' }}>
      <button className="btn btn-ghost" style={{ padding: '4px 10px', fontSize: 12 }} onClick={() => setOpen(o => !o)}>
        <Zap size={12} /> Act <ChevronDown size={11} />
      </button>
      {open && (
        <div style={{
          position: 'absolute', right: 0, top: '100%', marginTop: 4, zIndex: 50,
          background: 'var(--bg-2)', border: '1px solid var(--border-2)', borderRadius: 8,
          minWidth: 160, overflow: 'hidden', boxShadow: '0 8px 24px rgba(0,0,0,0.4)',
        }}>
          {ACTIONS.map(({ key, label, color }) => (
            <button key={key} disabled={!!loading}
              onClick={() => fire(key)}
              style={{
                display: 'block', width: '100%', textAlign: 'left',
                padding: '8px 14px', background: 'transparent', border: 'none',
                fontSize: 12, color: loading === key ? 'var(--text-3)' : color,
                cursor: 'pointer', fontFamily: 'var(--font-body)',
                transition: 'background 0.1s',
              }}
              onMouseEnter={e => e.currentTarget.style.background = 'var(--bg-3)'}
              onMouseLeave={e => e.currentTarget.style.background = 'transparent'}
            >
              {loading === key ? 'Queuing…' : label}
            </button>
          ))}
        </div>
      )}
    </div>
  )
}

function ResourceRow({ r, onDone }) {
  const [expanded, setExpanded] = useState(false)
  const qc = useQueryClient()

  const doExempt = async () => {
    try {
      await toggleExempt(r.id)
      toast.success(r.exempt ? 'Exemption removed' : 'Marked exempt')
      qc.invalidateQueries('resources')
    } catch { toast.error('Failed') }
  }

  return (
    <>
      <tr
        style={{ borderBottom: '1px solid var(--border)', cursor: 'pointer', opacity: r.exempt ? 0.55 : 1 }}
        onClick={() => setExpanded(e => !e)}
      >
        <td style={{ padding: '10px 14px' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            {expanded ? <ChevronUp size={12} color="var(--text-3)" /> : <ChevronDown size={12} color="var(--text-3)" />}
            <div>
              <div style={{ fontSize: 13, fontWeight: 500, color: 'var(--text)' }}>{r.resource_name}</div>
              <div style={{ fontSize: 11, color: 'var(--text-3)', fontFamily: 'var(--font-mono)' }}>{r.resource_type}</div>
            </div>
          </div>
        </td>
        <td style={{ padding: '10px 14px', fontSize: 12, color: 'var(--text-2)' }}>{r.resource_group}</td>
        <td style={{ padding: '10px 14px', fontSize: 12, color: 'var(--text-2)' }}>{r.location}</td>
        <td style={{ padding: '10px 14px' }}>
          <span className={`badge ${SEV[r.severity] || 'badge-medium'}`}>{r.severity}</span>
        </td>
        <td style={{ padding: '10px 14px', fontFamily: 'var(--font-mono)', fontSize: 13, color: 'var(--red)', fontWeight: 600 }}>
          £{Math.round(r.estimated_monthly_cost)}<span style={{ color: 'var(--text-3)', fontWeight: 400, fontSize: 11 }}>/mo</span>
        </td>
        <td style={{ padding: '10px 14px' }}>
          <LadderBar status={r.ladder_status} />
        </td>
        <td style={{ padding: '10px 14px' }}>
          <div style={{ display: 'flex', gap: 6, alignItems: 'center' }} onClick={e => e.stopPropagation()}>
            <button className="btn btn-ghost" style={{ padding: '4px 8px', fontSize: 11 }} onClick={doExempt} title={r.exempt ? 'Remove exemption' : 'Mark exempt'}>
              {r.exempt ? <ShieldOff size={12} color="var(--green)" /> : <Shield size={12} />}
            </button>
            {!r.exempt && <ActionMenu resource={r} onDone={() => { qc.invalidateQueries('resources'); qc.invalidateQueries('summary') }} />}
          </div>
        </td>
      </tr>
      {expanded && (
        <tr style={{ borderBottom: '1px solid var(--border)', background: 'var(--bg-1)' }}>
          <td colSpan={7} style={{ padding: '12px 14px 16px 44px' }}>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 12 }}>
              <div>
                <div style={{ fontSize: 11, color: 'var(--text-3)', marginBottom: 4, textTransform: 'uppercase', letterSpacing: '0.06em', fontFamily: 'var(--font-mono)' }}>Resource ID</div>
                <div style={{ fontSize: 11, fontFamily: 'var(--font-mono)', color: 'var(--text-2)', wordBreak: 'break-all' }}>{r.resource_id}</div>
              </div>
              <div>
                <div style={{ fontSize: 11, color: 'var(--text-3)', marginBottom: 4, textTransform: 'uppercase', letterSpacing: '0.06em', fontFamily: 'var(--font-mono)' }}>Policy</div>
                <div style={{ fontSize: 12, color: 'var(--text-2)' }}>{r.policy_name}</div>
              </div>
              <div>
                <div style={{ fontSize: 11, color: 'var(--text-3)', marginBottom: 4, textTransform: 'uppercase', letterSpacing: '0.06em', fontFamily: 'var(--font-mono)' }}>First seen</div>
                <div style={{ fontSize: 12, color: 'var(--text-2)', fontFamily: 'var(--font-mono)' }}>
                  {r.first_seen ? format(new Date(r.first_seen), 'dd MMM yyyy HH:mm') : '—'}
                </div>
              </div>
              {r.tags && Object.keys(r.tags).length > 0 && (
                <div style={{ gridColumn: '1/-1' }}>
                  <div style={{ fontSize: 11, color: 'var(--text-3)', marginBottom: 6, textTransform: 'uppercase', letterSpacing: '0.06em', fontFamily: 'var(--font-mono)' }}>Tags</div>
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
                    {Object.entries(r.tags).map(([k, v]) => (
                      <span key={k} style={{ fontSize: 11, fontFamily: 'var(--font-mono)', background: 'var(--bg-3)', padding: '2px 8px', borderRadius: 4, color: 'var(--text-2)', border: '1px solid var(--border)' }}>
                        {k}: {v}
                      </span>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </td>
        </tr>
      )}
    </>
  )
}

export default function ResourcesPage() {
  const qc = useQueryClient()
  const [filters, setFilters] = useState({ category: '', severity: '', ladder_status: '', search: '' })
  const [showFilters, setShowFilters] = useState(false)

  const params = {}
  if (filters.category)      params.category = filters.category
  if (filters.severity)      params.severity = filters.severity
  if (filters.ladder_status) params.ladder_status = filters.ladder_status

  const { data: resources = [], isFetching } = useQuery(
    ['resources', params],
    () => fetchResources({ ...params, limit: 200 })
  )

  const filtered = filters.search
    ? resources.filter(r =>
        r.resource_name?.toLowerCase().includes(filters.search.toLowerCase()) ||
        r.resource_group?.toLowerCase().includes(filters.search.toLowerCase()) ||
        r.resource_type?.toLowerCase().includes(filters.search.toLowerCase())
      )
    : resources

  const totalWaste = filtered.reduce((s, r) => s + (r.estimated_monthly_cost || 0), 0)

  const setFilter = (k, v) => setFilters(f => ({ ...f, [k]: f[k] === v ? '' : v }))

  return (
    <div style={{ padding: '28px 32px' }} className="fade-in">
      {/* Header */}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 20 }}>
        <div>
          <h1 style={{ fontFamily: 'var(--font-display)', fontSize: 24, fontWeight: 700, marginBottom: 4 }}>Waste Resources</h1>
          <p style={{ color: 'var(--text-2)', fontSize: 13 }}>
            {filtered.length} resources · <span style={{ color: 'var(--red)', fontFamily: 'var(--font-mono)' }}>£{Math.round(totalWaste).toLocaleString()}/mo</span> identified
          </p>
        </div>
        <button className="btn btn-ghost" onClick={() => setShowFilters(f => !f)}>
          <Filter size={13} /> Filters {showFilters ? <ChevronUp size={12} /> : <ChevronDown size={12} />}
        </button>
      </div>

      {/* Filter bar */}
      {showFilters && (
        <div className="card" style={{ padding: '16px 20px', marginBottom: 16, display: 'flex', gap: 16, alignItems: 'flex-end', flexWrap: 'wrap' }}>
          <div style={{ flex: '1 1 200px', minWidth: 180 }}>
            <label>Search</label>
            <div style={{ position: 'relative' }}>
              <Search size={13} style={{ position: 'absolute', left: 9, top: '50%', transform: 'translateY(-50%)', color: 'var(--text-3)' }} />
              <input style={{ paddingLeft: 30 }} placeholder="Name, group, type…"
                value={filters.search} onChange={e => setFilters(f => ({...f, search: e.target.value}))} />
            </div>
          </div>
          <div style={{ flex: '0 1 140px' }}>
            <label>Category</label>
            <select value={filters.category} onChange={e => setFilters(f => ({...f, category: e.target.value}))}>
              <option value="">All</option>
              {['idle','orphaned','right-size','tagging','storage'].map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <div style={{ flex: '0 1 130px' }}>
            <label>Severity</label>
            <select value={filters.severity} onChange={e => setFilters(f => ({...f, severity: e.target.value}))}>
              <option value="">All</option>
              {['critical','high','medium','low'].map(s => <option key={s} value={s}>{s}</option>)}
            </select>
          </div>
          <div style={{ flex: '0 1 160px' }}>
            <label>Ladder status</label>
            <select value={filters.ladder_status} onChange={e => setFilters(f => ({...f, ladder_status: e.target.value}))}>
              <option value="">All</option>
              {['notify','tagged','deallocated','deleted','exempt'].map(s => <option key={s} value={s}>{s}</option>)}
            </select>
          </div>
          <button className="btn btn-ghost" onClick={() => setFilters({ category: '', severity: '', ladder_status: '', search: '' })}>
            Clear
          </button>
        </div>
      )}

      {/* Quick filter pills */}
      <div style={{ display: 'flex', gap: 8, marginBottom: 16, flexWrap: 'wrap' }}>
        {['idle','orphaned','right-size','tagging','storage'].map(c => (
          <button key={c} onClick={() => setFilter('category', c)}
            className="btn btn-ghost"
            style={{ padding: '4px 12px', fontSize: 12,
              borderColor: filters.category === c ? 'var(--accent)' : 'var(--border)',
              color: filters.category === c ? 'var(--accent)' : 'var(--text-2)' }}>
            {c}
          </button>
        ))}
        <div style={{ width: 1, background: 'var(--border)', margin: '0 4px' }} />
        {['notify','tagged','deallocated'].map(s => (
          <button key={s} onClick={() => setFilter('ladder_status', s)}
            className="btn btn-ghost"
            style={{ padding: '4px 12px', fontSize: 12,
              borderColor: filters.ladder_status === s ? LADDER_COLORS[s] : 'var(--border)',
              color: filters.ladder_status === s ? LADDER_COLORS[s] : 'var(--text-2)' }}>
            {s}
          </button>
        ))}
      </div>

      {/* Table */}
      <div className="card" style={{ overflow: 'auto' }}>
        <table style={{ width: '100%', borderCollapse: 'collapse' }}>
          <thead>
            <tr>
              {['Resource', 'Resource group', 'Location', 'Severity', 'Cost/mo', 'Ladder', 'Actions'].map(h => (
                <th key={h} style={{ textAlign: 'left', padding: '10px 14px', fontSize: 11, color: 'var(--text-3)', fontFamily: 'var(--font-mono)', textTransform: 'uppercase', letterSpacing: '0.06em', borderBottom: '1px solid var(--border)', whiteSpace: 'nowrap' }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {filtered.map(r => (
              <ResourceRow key={r.id} r={r} onDone={() => { qc.invalidateQueries('resources'); qc.invalidateQueries('summary') }} />
            ))}
            {!filtered.length && (
              <tr><td colSpan={7} style={{ padding: '40px', textAlign: 'center', color: 'var(--text-3)' }}>
                {isFetching ? 'Loading…' : 'No waste resources found with current filters.'}
              </td></tr>
            )}
          </tbody>
        </table>
      </div>
    </div>
  )
}
