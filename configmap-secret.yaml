import { useQuery, useMutation, useQueryClient } from 'react-query'
import { fetchSummary, fetchRunHistory, fetchByCategory, fetchRuns, triggerRuns, fetchPolicies } from '../../lib/api'
import { AreaChart, Area, BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, Cell } from 'recharts'
import { TrendingDown, Zap, Server, Play, Clock, CheckCircle, AlertTriangle, XCircle, RefreshCw } from 'lucide-react'
import { format } from 'date-fns'
import toast from 'react-hot-toast'
import { useState } from 'react'

const fmt = (n) => n >= 1000 ? `£${(n/1000).toFixed(1)}k` : `£${Math.round(n)}`

const StatusDot = ({ status }) => {
  const colors = { completed: 'var(--green)', running: 'var(--accent)', failed: 'var(--red)', pending: 'var(--amber)', cancelled: 'var(--text-3)' }
  return <span style={{ width: 7, height: 7, borderRadius: '50%', background: colors[status] || 'var(--text-3)', display: 'inline-block', flexShrink: 0 }} className={status === 'running' ? 'pulse-dot' : ''} />
}

const CustomTooltip = ({ active, payload, label }) => {
  if (!active || !payload?.length) return null
  return (
    <div className="card" style={{ padding: '10px 14px', fontSize: 12 }}>
      <div style={{ color: 'var(--text-2)', marginBottom: 6, fontFamily: 'var(--font-mono)' }}>{label}</div>
      {payload.map(p => (
        <div key={p.name} style={{ color: p.color, display: 'flex', gap: 8, alignItems: 'center' }}>
          <span style={{ color: 'var(--text-2)' }}>{p.name}:</span>
          <span style={{ fontFamily: 'var(--font-mono)' }}>{p.name === 'waste' ? fmt(p.value) : p.value}</span>
        </div>
      ))}
    </div>
  )
}

export default function Dashboard() {
  const qc = useQueryClient()
  const [triggering, setTriggering] = useState(false)
  const { data: summary } = useQuery('summary', fetchSummary)
  const { data: history = [] } = useQuery('runHistory', () => fetchRunHistory(14))
  const { data: byCategory = [] } = useQuery('byCategory', fetchByCategory)
  const { data: runs = [] } = useQuery('runs', () => fetchRuns(8))
  const { data: policies = [] } = useQuery('policies', fetchPolicies)

  const triggerAll = async () => {
    const enabledIds = policies.filter(p => p.enabled).map(p => p.id)
    if (!enabledIds.length) return toast.error('No enabled policies found')
    setTriggering(true)
    try {
      const res = await triggerRuns({ policy_ids: enabledIds })
      toast.success(`Spawned ${res.spawned} policy runs across all subscriptions`)
      qc.invalidateQueries('runs')
      qc.invalidateQueries('summary')
    } catch { toast.error('Failed to trigger runs') }
    finally { setTriggering(false) }
  }

  const CATEGORY_COLORS = { idle: '#ff4e6a', orphaned: '#ffb547', 'right-size': '#9b7cff', tagging: '#00d4ff', storage: '#00e5a0' }

  return (
    <div style={{ padding: '28px 32px' }} className="fade-in">
      {/* Header */}
      <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', marginBottom: 28 }}>
        <div>
          <h1 style={{ fontFamily: 'var(--font-display)', fontSize: 26, fontWeight: 700, color: 'var(--text)', marginBottom: 4 }}>
            Cost Intelligence
          </h1>
          <p style={{ color: 'var(--text-2)', fontSize: 13 }}>
            Azure waste detection across all subscriptions — {format(new Date(), 'EEE d MMM yyyy, HH:mm')}
          </p>
        </div>
        <button className="btn btn-primary" onClick={triggerAll} disabled={triggering} style={{ gap: 8 }}>
          {triggering ? <RefreshCw size={14} style={{ animation: 'spin 1s linear infinite' }} /> : <Play size={14} />}
          {triggering ? 'Scheduling…' : 'Run all policies'}
        </button>
      </div>

      {/* Summary cards */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 16, marginBottom: 28 }}>
        {[
          {
            label: 'Identified waste', icon: TrendingDown, color: 'var(--red)',
            value: fmt(summary?.total_identified_waste_monthly || 0),
            sub: 'per month across all subs',
          },
          {
            label: 'Realised savings', icon: CheckCircle, color: 'var(--green)',
            value: fmt(summary?.total_realised_savings_monthly || 0),
            sub: `execution efficiency ${summary ? Math.round((summary.total_realised_savings_monthly / (summary.total_identified_waste_monthly || 1)) * 100) : 0}%`,
          },
          {
            label: 'Waste resources', icon: Server, color: 'var(--amber)',
            value: (summary?.total_waste_resources || 0).toLocaleString(),
            sub: 'pending remediation',
          },
          {
            label: 'Runs (24h)', icon: Zap, color: 'var(--accent)',
            value: (summary?.runs_last_24h || 0).toLocaleString(),
            sub: `${summary?.total_remediation_actions || 0} total actions taken`,
          },
        ].map(({ label, icon: Icon, color, value, sub }) => (
          <div key={label} className="card" style={{ padding: 20, position: 'relative', overflow: 'hidden' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 14 }}>
              <span style={{ fontSize: 11, color: 'var(--text-3)', textTransform: 'uppercase', letterSpacing: '0.07em', fontFamily: 'var(--font-mono)' }}>
                {label}
              </span>
              <Icon size={14} color={color} />
            </div>
            <div style={{ fontFamily: 'var(--font-display)', fontSize: 28, fontWeight: 700, color, lineHeight: 1, marginBottom: 6 }}>
              {value}
            </div>
            <div style={{ fontSize: 12, color: 'var(--text-3)' }}>{sub}</div>
            <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, height: 2, background: color, opacity: 0.25 }} />
          </div>
        ))}
      </div>

      {/* Charts row */}
      <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr', gap: 16, marginBottom: 28 }}>
        {/* Run history */}
        <div className="card" style={{ padding: 20 }}>
          <div style={{ marginBottom: 16, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <span style={{ fontFamily: 'var(--font-display)', fontWeight: 600, fontSize: 14 }}>Waste identified — 14 days</span>
            <span style={{ fontSize: 11, color: 'var(--text-3)', fontFamily: 'var(--font-mono)' }}>GBP / month</span>
          </div>
          <ResponsiveContainer width="100%" height={180}>
            <AreaChart data={history} margin={{ top: 4, right: 4, left: -20, bottom: 0 }}>
              <defs>
                <linearGradient id="wasteGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="5%"  stopColor="#ff4e6a" stopOpacity={0.3} />
                  <stop offset="95%" stopColor="#ff4e6a" stopOpacity={0} />
                </linearGradient>
              </defs>
              <XAxis dataKey="day" tick={{ fontSize: 10, fill: 'var(--text-3)', fontFamily: 'var(--font-mono)' }} tickFormatter={d => d?.slice(5)} />
              <YAxis tick={{ fontSize: 10, fill: 'var(--text-3)', fontFamily: 'var(--font-mono)' }} tickFormatter={v => `£${v}`} />
              <Tooltip content={<CustomTooltip />} />
              <Area type="monotone" dataKey="waste" name="waste" stroke="var(--red)" strokeWidth={2} fill="url(#wasteGrad)" />
            </AreaChart>
          </ResponsiveContainer>
        </div>

        {/* Waste by category */}
        <div className="card" style={{ padding: 20 }}>
          <div style={{ marginBottom: 16, fontFamily: 'var(--font-display)', fontWeight: 600, fontSize: 14 }}>Waste by category</div>
          <ResponsiveContainer width="100%" height={180}>
            <BarChart data={byCategory} layout="vertical" margin={{ top: 0, right: 8, left: 0, bottom: 0 }}>
              <XAxis type="number" tick={{ fontSize: 10, fill: 'var(--text-3)', fontFamily: 'var(--font-mono)' }} tickFormatter={v => `£${v}`} />
              <YAxis type="category" dataKey="category" width={72} tick={{ fontSize: 11, fill: 'var(--text-2)', fontFamily: 'var(--font-mono)' }} />
              <Tooltip content={<CustomTooltip />} />
              <Bar dataKey="total_cost" name="waste" radius={[0, 4, 4, 0]}>
                {byCategory.map(entry => (
                  <Cell key={entry.category} fill={CATEGORY_COLORS[entry.category] || 'var(--accent)'} fillOpacity={0.85} />
                ))}
              </Bar>
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>

      {/* Recent runs table */}
      <div className="card" style={{ padding: 20 }}>
        <div style={{ marginBottom: 16, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <span style={{ fontFamily: 'var(--font-display)', fontWeight: 600, fontSize: 14 }}>Recent policy runs</span>
          <a href="/runs" style={{ fontSize: 12, color: 'var(--accent)', textDecoration: 'none' }}>View all →</a>
        </div>
        <table style={{ width: '100%', borderCollapse: 'collapse' }}>
          <thead>
            <tr>
              {['Status', 'Policy run ID', 'Subscription', 'Resources', 'Est. waste/mo', 'Started'].map(h => (
                <th key={h} style={{ textAlign: 'left', padding: '6px 10px', fontSize: 11, color: 'var(--text-3)', fontFamily: 'var(--font-mono)', textTransform: 'uppercase', letterSpacing: '0.06em', borderBottom: '1px solid var(--border)' }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {runs.map(run => (
              <tr key={run.id} style={{ borderBottom: '1px solid var(--border)' }}>
                <td style={{ padding: '9px 10px' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                    <StatusDot status={run.status} />
                    <span style={{ fontSize: 12, color: 'var(--text-2)', fontFamily: 'var(--font-mono)' }}>{run.status}</span>
                  </div>
                </td>
                <td style={{ padding: '9px 10px', fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--text-3)' }}>
                  {run.id?.slice(0, 16)}…
                </td>
                <td style={{ padding: '9px 10px', fontSize: 12, color: 'var(--text-2)' }}>
                  {run.subscription_id?.slice(0, 20)}…
                </td>
                <td style={{ padding: '9px 10px', fontFamily: 'var(--font-mono)', fontSize: 13, color: 'var(--text)' }}>
                  {run.resources_found ?? '—'}
                </td>
                <td style={{ padding: '9px 10px', fontFamily: 'var(--font-mono)', fontSize: 13, color: run.estimated_monthly_waste > 0 ? 'var(--red)' : 'var(--text-3)' }}>
                  {run.estimated_monthly_waste ? fmt(run.estimated_monthly_waste) : '—'}
                </td>
                <td style={{ padding: '9px 10px', fontSize: 11, color: 'var(--text-3)', fontFamily: 'var(--font-mono)' }}>
                  {run.created_at ? format(new Date(run.created_at), 'dd MMM HH:mm') : '—'}
                </td>
              </tr>
            ))}
            {!runs.length && (
              <tr><td colSpan={6} style={{ padding: '24px 10px', textAlign: 'center', color: 'var(--text-3)', fontSize: 13 }}>No runs yet — trigger a scan above.</td></tr>
            )}
          </tbody>
        </table>
      </div>
    </div>
  )
}
